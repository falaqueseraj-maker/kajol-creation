<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Parda House — Customer Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f4ef;
            color: #29231f;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: min(420px, 100%);
            background: white;
            border: 1px solid #e5dcd2;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, .08);
        }

        .logo {
            text-align: center;
            font: 600 30px 'Playfair Display';
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 12px;
            cursor: pointer;
            color: #888;
            font-size: 13px;
        }

        .tab.active {
            color: #29231f;
            font-weight: 700;
            border-bottom: 2px solid #29231f;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 7px;
            color: #555;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 0 13px;
            font-size: 13px;
            outline: none;
            font-family: 'DM Sans', sans-serif;
        }

        input:focus {
            border-color: #29231f;
        }

        .btn {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 7px;
            background: #29231f;
            color: white;
            cursor: pointer;
            font-size: 13px;
            margin-top: 5px;
            font-family: 'DM Sans', sans-serif;
            transition: .2s ease;
        }

        .btn:hover {
            background: #8b6045;
        }

        .btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
        }

        .error {
            background: #ffeaea;
            color: #c40000;
        }

        .success {
            background: #eaf7ed;
            color: #287a3d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #555;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #29231f;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        @media(max-width:500px) {

            .login-box {
                padding: 28px 22px;
            }

            .logo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            PARDA HOUSE
        </div>

        <div class="subtitle">
            Customer Account
        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                class="tab"
                id="signupTab"
                onclick="showSignup()"
            >
                Create Account
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            class="message error"
            id="errorMessage"
        ></div>

        <div
            class="message success"
            id="successMessage"
        ></div>


        <!-- LOGIN FORM -->

        <div
            class="form active"
            id="loginForm"
        >

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="btn"
                id="loginButton"
                onclick="loginCustomer()"
            >
                Login
            </button>

        </div>


        <!-- SIGNUP FORM -->

        <div
            class="form"
            id="signupForm"
        >

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Enter mobile number"
                    autocomplete="tel"
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >

            </div>


            <button
                class="btn"
                id="signupButton"
                onclick="signupCustomer()"
            >
                Create Account
            </button>

        </div>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Store
        </a>

    </div>


    <script>

        /* =====================================================
           BACKEND API
        ===================================================== */

        const API_BASE_URL = "https://localhost:57742/api/Customer";


        /* =====================================================
           SHOW LOGIN
        ===================================================== */

        function showLogin() {

            document
                .getElementById("loginForm")
                .classList.add("active");

            document
                .getElementById("signupForm")
                .classList.remove("active");

            document
                .getElementById("loginTab")
                .classList.add("active");

            document
                .getElementById("signupTab")
                .classList.remove("active");

            clearMessages();
        }


        /* =====================================================
           SHOW SIGNUP
        ===================================================== */

        function showSignup() {

            document
                .getElementById("signupForm")
                .classList.add("active");

            document
                .getElementById("loginForm")
                .classList.remove("active");

            document
                .getElementById("signupTab")
                .classList.add("active");

            document
                .getElementById("loginTab")
                .classList.remove("active");

            clearMessages();
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showError(message) {

            const box =
                document.getElementById("errorMessage");

            box.textContent = message;
            box.style.display = "block";

            document
                .getElementById("successMessage")
                .style.display = "none";
        }


        function showSuccess(message) {

            const box =
                document.getElementById("successMessage");

            box.textContent = message;
            box.style.display = "block";

            document
                .getElementById("errorMessage")
                .style.display = "none";
        }


        function clearMessages() {

            document
                .getElementById("errorMessage")
                .style.display = "none";

            document
                .getElementById("successMessage")
                .style.display = "none";
        }


        /* =====================================================
           BUTTON LOADING
        ===================================================== */

        function setButtonLoading(buttonId, loading, normalText) {

            const button =
                document.getElementById(buttonId);

            if (!button) return;

            button.disabled = loading;

            if (loading) {

                button.textContent = "Please wait...";

            } else {

                button.textContent = normalText;

            }
        }


        /* =====================================================
           SAFE JSON RESPONSE
        ===================================================== */

        async function getResponseData(response) {

            try {

                return await response.json();

            } catch {

                return null;

            }
        }


        /* =====================================================
           SIGNUP
        ===================================================== */

        async function signupCustomer() {

            clearMessages();

            const name =
                document
                    .getElementById("signupName")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("signupPhone")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("signupEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById("signupPassword")
                    .value
                    .trim();


            /* VALIDATION */

            if (!name) {

                showError("Please enter your name.");
                return;

            }


            if (!phone) {

                showError("Please enter your mobile number.");
                return;

            }


            if (!email) {

                showError("Please enter your email.");
                return;

            }


            if (!password) {

                showError("Please create a password.");
                return;

            }


            if (password.length < 6) {

                showError(
                    "Password must be at least 6 characters."
                );

                return;

            }


            setButtonLoading(
                "signupButton",
                true,
                "Create Account"
            );


            try {

                /* =========================================
                   SEND DATA TO ASP.NET CORE API
                ========================================= */

                const response = await fetch(
                    `${API_BASE_URL}/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            phone: phone,
                            password: password
                        })
                    }
                );


                const data =
                    await getResponseData(response);


                /* =========================================
                   DUPLICATE EMAIL
                ========================================= */

                if (response.status === 409) {

                    showError(
                        data?.message ||
                        "An account with this email already exists."
                    );

                    return;

                }


                /* =========================================
                   OTHER API ERROR
                ========================================= */

                if (!response.ok) {

                    showError(
                        data?.message ||
                        "Unable to create account. Please try again."
                    );

                    return;

                }


                /* =========================================
                   SUCCESS
                ========================================= */

                showSuccess(
                    data?.message ||
                    "Account created successfully. Please login."
                );


                /* Put email into login form */

                document.getElementById(
                    "loginEmail"
                ).value = email;


                /* Clear signup form */

                document.getElementById(
                    "signupName"
                ).value = "";

                document.getElementById(
                    "signupPhone"
                ).value = "";

                document.getElementById(
                    "signupEmail"
                ).value = "";

                document.getElementById(
                    "signupPassword"
                ).value = "";


                /* Switch to Login */

                setTimeout(
                    () => {

                        showLogin();

                        document.getElementById(
                            "loginEmail"
                        ).value = email;

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Signup Error:",
                    error
                );

                showError(
                    "Unable to connect to the server. Make sure the Parda House backend is running."
                );

            } finally {

                setButtonLoading(
                    "signupButton",
                    false,
                    "Create Account"
                );

            }

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        async function loginCustomer() {

            clearMessages();

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById("loginPassword")
                    .value
                    .trim();


            /* VALIDATION */

            if (!email || !password) {

                showError(
                    "Please enter email and password."
                );

                return;

            }


            setButtonLoading(
                "loginButton",
                true,
                "Login"
            );


            try {

                /* =========================================
                   SEND LOGIN REQUEST TO ASP.NET CORE API
                ========================================= */

                const response = await fetch(
                    `${API_BASE_URL}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data =
                    await getResponseData(response);


                /* =========================================
                   INVALID LOGIN
                ========================================= */

                if (response.status === 401) {

                    showError(
                        data?.message ||
                        "Invalid email or password."
                    );

                    return;

                }


                /* =========================================
                   OTHER API ERROR
                ========================================= */

                if (!response.ok) {

                    showError(
                        data?.message ||
                        "Login failed. Please try again."
                    );

                    return;

                }


                /* =========================================
                   SUCCESS
                ========================================= */

                if (
                    !data ||
                    !data.success ||
                    !data.customer
                ) {

                    showError(
                        "Login response was not valid."
                    );

                    return;

                }


                /* =========================================
                   SAVE LOGGED-IN CUSTOMER
                   
                   IMPORTANT:
                   Password is NOT saved.
                ========================================= */

                const customer = {

                    id: data.customer.id,

                    name: data.customer.name,

                    email: data.customer.email,

                    phone: data.customer.phone || null

                };


                localStorage.setItem(
                    "customerLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "currentCustomer",
                    JSON.stringify(customer)
                );


                /* =========================================
                   REMOVE OLD LOCAL CUSTOMER DATA
                   
                   This prevents the old localStorage
                   customer system from being used.
                ========================================= */

                localStorage.removeItem(
                    "pardaCustomers"
                );


                /* =========================================
                   GO TO STORE
                ========================================= */

                window.location.href =
                    "index.html";


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );

                showError(
                    "Unable to connect to the server. Make sure the Parda House backend is running."
                );

            } finally {

                setButtonLoading(
                    "loginButton",
                    false,
                    "Login"
                );

            }

        }


        /* =====================================================
           ENTER KEY SUPPORT
        ===================================================== */

        document
            .getElementById("loginPassword")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        loginCustomer();

                    }

                }
            );


        document
            .getElementById("signupPassword")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        signupCustomer();

                    }

                }
            );

    </script>

</body>

</html>
