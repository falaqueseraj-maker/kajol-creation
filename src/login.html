<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parda House - Seller Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f4ef;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e6ddd4;
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .logo {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            color: #29231f;
            margin-bottom: 10px;
        }

        .sub {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #555;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #29231f;
        }

        .btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #29231f;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #8b6045;
        }

        .error {
            background: #ffeaea;
            color: #c70000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .demo {
            margin-top: 25px;
            padding: 15px;
            background: #f8f6f2;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #29231f;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            PARDA HOUSE
        </div>

        <div class="sub">
            Seller Dashboard Login
        </div>

        <div class="error" id="errorBox">
            Invalid Email or Password
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button class="btn" onclick="login()">
            Login
        </button>

        <div class="demo">
            <b>Demo Login</b><br><br>

            Email:<br>
            admin@pardahouse.com
            <br><br>

            Password:<br>
            123456
        </div>

        <a href="index.html" class="back">
            ← Back to Store
        </a>

    </div>

    <script>

      const API_BASE_URL =
  "https://kajolcreation-payment-api.onrender.com/api";


        async function login() {

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value
                    .trim();

            const errorBox =
                document.getElementById("errorBox");


            // Hide previous error
            errorBox.style.display = "none";


            // Basic validation
            if (!email || !password) {

                errorBox.textContent =
                    "Please enter email and password.";

                errorBox.style.display = "block";

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/Seller/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (response.ok && data.success) {

                    // Seller login state
                    localStorage.setItem(
                        "sellerLoggedIn",
                        "true"
                    );

                    localStorage.setItem(
                        "sellerEmail",
                        data.seller.email
                    );

                    localStorage.setItem(
                        "sellerRole",
                        data.seller.role
                    );


                    // Open seller dashboard
                    window.location.href =
                        "admin.html";

                }
                else {

                    errorBox.textContent =
                        data.message ||
                        "Invalid email or password.";

                    errorBox.style.display =
                        "block";
                }

            }
            catch (error) {

                console.error(
                    "Seller login error:",
                    error
                );

                errorBox.textContent =
                    "Unable to connect to server. Please try again.";

                errorBox.style.display =
                    "block";
            }
        }


        // ============================================
        // ENTER KEY LOGIN
        // ============================================

        document
            .getElementById("password")
            .addEventListener("keydown", function (event) {

                if (event.key === "Enter") {
                    login();
                }

            });


        // ============================================
        // ALREADY LOGGED IN
        // ============================================

        if (
            localStorage.getItem("sellerLoggedIn")
            === "true"
        ) {

            window.location.href =
                "admin.html";
        }

    </script>

</body>

</html>
